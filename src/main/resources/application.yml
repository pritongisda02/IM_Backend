spring:
  application:
    name: pos-system
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false

datasource:
  url: ${ORACLE_URL}
  username: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  driver-class-name: oracle.jdbc.OracleDriver

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  api-keys:
    branch-1: ${BRANCH_1_API_KEY}
    branch-2: ${BRANCH_2_API_KEY}

server:
  port: 8080